# Address → brand/short/name registry.
#
# The W3 Explorer fetches this file at runtime and consults it when
# resolving any step's `destination_brand_path` (declared on the
# command's display block in the action's manifest). The matching
# entry drives the destination-brand chip on the card header.
#
# # Keys
#
# Each top-level key is a lowercase 0x-prefixed Ethereum address.
# Entries for the same logical contract on different chains use
# different addresses; symbol lookups intentionally don't disambiguate
# across chains (callers needing chain-specific identity must use the
# address).
#
# # Required fields
#
# - brand: display name of the partner organisation (e.g. "Circle")
# - short: short symbol (e.g. "USDC")
# - name: full human-readable name (e.g. "USDC (Avalanche)")
# - kind: one of stablecoin | vault | router | other
#
# # Optional fields
#
# - logo: same allowlist as ActionDisplay.logo —
#   local `/logos/<file>.{svg,png,webp}` (chain-native bundled in
#   explorer) or `https://raw.githubusercontent.com/...` (partner
#   assets hosted in action repos)
# - color: hex string (`#RRGGBB`) used to tint the no-logo fallback
# - tier: low | mid | high — used by yield-vault widgets
# - partner: opaque partner identifier, useful for cross-referencing
#   action manifests
#
# # Adding an entry
#
# Drop a new key below. Explorer picks it up next render. No
# explorer change needed.

